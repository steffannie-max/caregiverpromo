<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      // SPA fallback for GitHub Pages project sites.
      // GitHub Pages URLs look like https://username.github.io/repo-name/route
      // so the first path segment is the repository name.
      var repoName = location.pathname.split('/')[1] || '';
      var base = repoName ? '/' + repoName + '/' : '/';
      var redirectTo = base + '?redirect=' + encodeURIComponent(location.pathname + location.search + location.hash);
      location.replace(redirectTo);
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
